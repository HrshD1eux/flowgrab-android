name: Build & Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Optional custom release tag (e.g. v2.0.0). Leave blank to auto-bump.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Configure Gradle Properties for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Bump Version & Prepare Release
        id: version_bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "${{ github.event.inputs.manual_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.manual_tag }}"
            RAW_TAG="${RAW_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_TAG"
            MAJOR=${MAJOR:-2}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-1}
            sed -i -E "s/versionMajor = [0-9]+/versionMajor = $MAJOR/" buildSrc/src/main/kotlin/Version.kt
            sed -i -E "s/versionMinor = [0-9]+/versionMinor = $MINOR/" buildSrc/src/main/kotlin/Version.kt
            sed -i -E "s/versionPatch = [0-9]+/versionPatch = $PATCH/" buildSrc/src/main/kotlin/Version.kt
            sed -i -E "s/Version\.[a-zA-Z]+/Version.Stable/" buildSrc/src/main/kotlin/Version.kt
            VERSION_NAME=$(./gradlew -q :app:printVersionName | tr -d '\r')
            if [ -z "${VERSION_NAME}" ]; then
              VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
            fi
            TAG_NAME="v${VERSION_NAME}"
          else
            CURRENT_PATCH=$(grep -o "versionPatch = [0-9]*" buildSrc/src/main/kotlin/Version.kt | awk '{print $3}')
            NEW_PATCH=$((CURRENT_PATCH + 1))
            sed -i -E "s/versionPatch = $CURRENT_PATCH/versionPatch = $NEW_PATCH/" buildSrc/src/main/kotlin/Version.kt
            sed -i -E "s/Version\.[a-zA-Z]+/Version.Stable/" buildSrc/src/main/kotlin/Version.kt
            
            VERSION_NAME=$(./gradlew -q :app:printVersionName | tr -d '\r')
            if [ -z "${VERSION_NAME}" ]; then
              MAJOR=$(grep -o "versionMajor = [0-9]*" buildSrc/src/main/kotlin/Version.kt | awk '{print $3}')
              MINOR=$(grep -o "versionMinor = [0-9]*" buildSrc/src/main/kotlin/Version.kt | awk '{print $3}')
              VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            TAG_NAME="v${VERSION_NAME}"
          fi

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > flowgrab-release.jks
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" > keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
            echo "storeFile=flowgrab-release.jks" >> keystore.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          else
            echo "WARNING: KEYSTORE_BASE64 secret not found in repository secrets. Building unsigned release."
          fi

      - name: Build Generic Release APKs
        run: ./gradlew assembleGenericRelease

      - name: Verify Generated APKs
        run: |
          ls -la app/build/outputs/apk/generic/release/
          APK_COUNT=$(find app/build/outputs/apk/generic/release/ -maxdepth 1 -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No APK files were generated!"
            exit 1
          fi
          echo "Found $APK_COUNT APK files ready for release."

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f flowgrab-release.jks keystore.properties

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlowGrab-${{ steps.version_bump.outputs.tag_name }}-APKs
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error

      - name: Commit Version Bump & Push Tag
        run: |
          git add buildSrc/src/main/kotlin/Version.kt
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.version_bump.outputs.version_name }} [skip ci]"
            git push origin main
          fi
          git tag -f "${{ steps.version_bump.outputs.tag_name }}"
          git push origin "${{ steps.version_bump.outputs.tag_name }}" --force

      - name: Generate Dynamic Release Notes
        run: |
          TAG="${{ steps.version_bump.outputs.tag_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)

          echo "## 🎉 FlowGrab ${TAG}" > release_notes.md
          echo "" >> release_notes.md
          echo "Released on $(date -u +'%B %d, %Y (%H:%M UTC)')" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 🚀 What's Changed in This Version:" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]" || true)
          else
            COMMITS=$(git log -n 10 --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]" || true)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Performance improvements, stability enhancements, and minor bug fixes."
          fi
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 📦 Generated APK Packages & Checksums:" >> release_notes.md
          echo "| Package File | Architecture | Size | SHA-256 Checksum |" >> release_notes.md
          echo "| :--- | :--- | :--- | :--- |" >> release_notes.md

          for apk in app/build/outputs/apk/generic/release/*.apk; do
            [ -f "$apk" ] || continue
            fname=$(basename "$apk")
            fsize=$(du -h "$apk" | awk '{print $1}')
            fhash=$(sha256sum "$apk" | awk '{print $1}')
            
            arch="Universal"
            if [[ "$fname" == *"arm64-v8a"* ]]; then
              arch="ARM64 (64-bit)"
            elif [[ "$fname" == *"armeabi-v7a"* ]]; then
              arch="ARMv7 (32-bit)"
            elif [[ "$fname" == *"x86_64"* ]]; then
              arch="x86_64"
            elif [[ "$fname" == *"x86"* ]]; then
              arch="x86 (32-bit)"
            fi
            
            echo "| \`$fname\` | **$arch** | $fsize | \`$fhash\` |" >> release_notes.md
          done
          echo "" >> release_notes.md

          echo "### 💡 Which APK Should I Download?" >> release_notes.md
          echo "- **ARM64 (\`arm64-v8a\`)**: Recommended for virtually all modern Android phones and tablets." >> release_notes.md
          echo "- **ARMv7 (\`armeabi-v7a\`)**: For older 32-bit Android phones." >> release_notes.md
          echo "- **Universal**: Compatible with all devices (combines all native ABIs). Choose this if you are unsure." >> release_notes.md
          echo "- **x86_64 / x86**: For PC Android emulators, ChromeOS devices, and virtual testing." >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/HrshD1eux/flowgrab-android/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.tag_name }}
          name: FlowGrab ${{ steps.version_bump.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/generic/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
